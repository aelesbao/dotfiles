# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

disableStartupPopups: true
# one of: 'prompt' | 'create' | 'skip' | 'quit'
notARepository: "quit"
git:
  commit:
    signOff: true
  # If true, do not spawn a separate process when using GPG
  overrideGpg: false
  merging:
    args: "--no-ff"
  parseEmoji: true
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
gui:
  showRandomTip: false
  # show commit hashes alongside branch names
  showBranchCommitHash: true
  # nerd fonts version to use ("2" or "3"); empty means don't show nerd font icons
  nerdFontsVersion: "3"
  # for skipping the confirmation before launching the reword editor
  skipRewordInEditorWarning: true
  # https://pkg.go.dev/time#Time.Format
  timeFormat: "2006-01-02 15:04:05"
  shortTimeFormat: "15:04"
  # Config relating to the commit length indicator
  commitLength:
    # If true, show an indicator of commit message length
    show: true
# Config relating to things outside of Lazygit like how files are opened,
# copying to clipboard, etc
os:
  # A built-in preset that sets all of the above settings. Supported presets are
  # defined in the getPreset function in editor_presets.go.
  editPreset: "nvim"
refresher:
  refreshInterval: 10 # File/submodule refresh interval in seconds. Auto-refresh can be disabled via option 'git.autoRefresh'.
  fetchInterval: 600 # Re-fetch interval in seconds. Auto-fetch can be disabled via option 'git.autoFetch'.
update:
  method: never
customCommands:
  - key: t
    command: tig {{.SelectedSubCommit.Sha}} -- {{.SelectedCommitFile.Name}}
    context: commitFiles
    description: tig file (history of commits affecting file)
    output: terminal
  - key: t
    command: tig -- {{.SelectedFile.Name}}
    context: files
    description: tig file (history of commits affecting file)
    output: terminal
  - key: "C"
    context: "files"
    description: "Create new conventional commit"
    prompts:
      - type: "menu"
        key: "Type"
        title: "Type of change"
        options:
          - name: "build"
            description: "Changes that affect the build system or external dependencies"
            value: "build"
          - name: "feat"
            description: "A new feature"
            value: "feat"
          - name: "fix"
            description: "A bug fix"
            value: "fix"
          - name: "chore"
            description: "Other changes that don't modify src or test files"
            value: "chore"
          - name: "ci"
            description: "Changes to CI configuration files and scripts"
            value: "ci"
          - name: "docs"
            description: "Documentation only changes"
            value: "docs"
          - name: "perf"
            description: "A code change that improves performance"
            value: "perf"
          - name: "refactor"
            description: "A code change that neither fixes a bug nor adds a feature"
            value: "refactor"
          - name: "revert"
            description: "Reverts a previous commit"
            value: "revert"
          - name: "style"
            description: "Changes that do not affect the meaning of the code"
            value: "style"
          - name: "test"
            description: "Adding missing tests or correcting existing tests"
            value: "test"
      - type: "input"
        title: "Scope (without parens)"
        key: "Scope"
        initialValue: ""
        # TODO: run command for list of components to suggest
        # suggestions:
        #   command: ""
      - type: "input"
        title: "Breaking change - Add '!'"
        key: "Breaking"
        initialValue: ""
      - type: "input"
        title: "message"
        key: "Message"
        initialValue: ""
      - type: "confirm"
        key: "Confirm"
        title: "Commit"
        body: "Are you sure you want to commit?"
    command: "git commit --message '{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}{{.Form.Breaking}}: {{.Form.Message}}'"
    loadingText: "Creating conventional commit..."
    output: terminal
  - key: "<c-r>"
    context: "global"
    description: "Create a pull request on GitHub"
    prompts:
      - type: "input"
        title: "Base branch"
        key: "Base"
        initialValue: "main"
        suggestions:
          preset: "branches"
      - type: "input"
        title: "Pull Request template name"
        key: "TemplateName"
        initialValue: ""
        suggestions:
          command: "find .github -type f -name '*.md' -printf '%f\n'"
    command: "gh pr create --editor --base '{{.Form.Base}}' {{if .Form.TemplateName}}--template '{{.Form.TemplateName}}'{{end}}"
    loadingText: "Creating pull request on GitHub"
    output: terminal
