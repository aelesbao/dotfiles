# See https://wiki.hyprland.org/Configuring/Binds/
# See https://wiki.hyprland.org/Configuring/Dispatchers/

# Bind flags:
# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# c -> click, will trigger on release of a key or button as long as the mouse cursor stays inside binds:drag_threshold.
# g -> drag, will trigger on release of a key or button as long as the mouse cursor moves outside binds:drag_threshold.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.

$mod = SUPER
$navMod = SUPER CONTROL
$altMod = SUPER ALT
$actionMod = SUPER CONTROL SHIFT
$altActionMod = SUPER ALT SHIFT
$hyperMod = SUPER CONTROL ALT SHIFT

# Remove existing bindings
unbind = CONTROL, Q

# <apps>

bindd = $mod,       space, Application launcher, exec, $launcher
bindd = $mod SHIFT, space, Open windows, exec, $windows
bindd = $navMod,    space, Icon viewer, exec, $emoji
bindd = $altMod,    space, Calculator, exec, $calc

bindd = $mod, e, File explorer, exec, $fileManager

bindd = $altMod,       n, Notification History,  exec, $notificationHistory
bindd = $actionMod,    n, Dismiss Notifications, exec, $dismissNotifications
bindd = $altActionMod, n, Toggle DND,            exec, $toggleDND

bindd = $altMod, backslash, Opens password manager, exec, $passwordManager

bindd = $mod SHIFT, v, Clipboard History, exec, $clipboardHistory
bindd = $mod SHIFT, 4, Screenshot,        exec, $screenshot
bindd = $mod SHIFT, 1, Color picker,      exec, $colorPicker

# </apps>

# <system>

bindd = $navMod, up, Toggle Expo, hyprexpo:expo, toggle
# plugin Hyprspace is broken
# bindd = $navMod, down, Toggle Hyprspace, overview:toggle, all

bindd = $mod,    escape,    Lock Session, exec, loginctl lock-session
bindd = $navMod, Q,         Lock Session, exec, loginctl lock-session   # macOS muscle memory
bindd = $navMod, backspace, Logout,       exec, killall wlogout; wlogout -b 6
# sleep button
binds = Super_L&Alt_L, XF86Eject&ISO_Next_Group, exec, killall wlogout; wlogout -b 6

# </system>

# <workspaces>

# Navigate through existing workspaces
bind = $navMod, bracketleft,  workspace, e-1
bind = $navMod, bracketright, workspace, e+1
# bind = $navMod, bracketleft,  workspace, hyprnome -p
# bind = $navMod, bracketright, workspace, hyprnome

# Scroll through existing workspaces with mod + mouse scroll
bind = $mod, mouse_down, workspace, e-1
bind = $mod, mouse_up,   workspace, e+1
# bind = $mod, mouse_down, workspace, hyprnome -p
# bind = $mod, mouse_up,   workspace, hyprnome

# Switch workspaces with mod + [0-9]
bind = $navMod, 1, workspace, 1
bind = $navMod, 2, workspace, 2
bind = $navMod, 3, workspace, 3
bind = $navMod, 4, workspace, 4
bind = $navMod, 5, workspace, 5
bind = $navMod, 6, workspace, 6
bind = $navMod, 7, workspace, 7
bind = $navMod, 8, workspace, 8
bind = $navMod, 9, workspace, 9
bind = $navMod, 0, workspace, 10

# Move windows to prev / next workspace
bind = $actionMod, bracketleft,  movetoworkspace, r-1
bind = $actionMod, bracketright, movetoworkspace, r+1

bind = $navMod,    s, togglespecialworkspace, media
bind = $actionMod, s, movetoworkspace,        special:media

bind = $navMod,    c, togglespecialworkspace, comms
bind = $actionMod, c, movetoworkspace,        special:comms

bind = $navMod,    m, togglespecialworkspace, mining
bind = $actionMod, m, movetoworkspace,        special:mining

bind = $navMod,    z, togglespecialworkspace, zen
bind = $actionMod, z, movetoworkspace,        special:zen

# </workspaces>

# <windows>

# Move focus with navMod + vim keys
bind = $navMod, h, movefocus, l
bind = $navMod, l, movefocus, r
bind = $navMod, k, movefocus, u
bind = $navMod, j, movefocus, d

# Move focus with mod
bind = $mod,       tab, cyclenext, next hist
bind = $mod,       tab, bringactivetotop
bind = $mod SHIFT, tab, cyclenext, prev hist
bind = $mod SHIFT, tab, bringactivetotop

# Move window with actionMod + vim keys
bind = $actionMod, h, movewindoworgroup, l
bind = $actionMod, l, movewindoworgroup, r
bind = $actionMod, k, movewindoworgroup, u
bind = $actionMod, j, movewindoworgroup, d

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $actionMod, 1, movetoworkspace, 1
bind = $actionMod, 2, movetoworkspace, 2
bind = $actionMod, 3, movetoworkspace, 3
bind = $actionMod, 4, movetoworkspace, 4
bind = $actionMod, 5, movetoworkspace, 5
bind = $actionMod, 6, movetoworkspace, 6
bind = $actionMod, 7, movetoworkspace, 7
bind = $actionMod, 8, movetoworkspace, 8
bind = $actionMod, 9, movetoworkspace, 9
bind = $actionMod, 0, movetoworkspace, 10

# Window actions
bindd = $mod, Q, Closes the active window, killactive,
bindd = $actionMod, Q, Force quits the current active window, forcekillactive,
bindd = $actionMod, F, Toggle window fullscreen mode, fullscreen,

# Dwindle
bind = $actionMod, P, pseudo, 
bind = $actionMod, J, togglesplit,

# Floating / Grouping
bind = $actionMod, T, togglefloating,
bind = $actionMod, G, togglegroup,
bind = $altActionMod, G, lockactivegroup, toggle

# Group focus with mod + vim keys
bind = $altMod, H, changegroupactive, b
bind = $altMod, L, changegroupactive, f

bind = $altActionMod, H, movegroupwindow, b
bind = $altActionMod, L, movegroupwindow, f

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# </windows>

# <multimedia>

# Multimedia keys for volume
bindel = , XF86AudioRaiseVolume,  exec, $volUp
bindel = , XF86AudioLowerVolume,  exec, $volDown
bindel = , XF86AudioMute,         exec, $volMute
bindel = CONTROL, XF86AudioRaiseVolume, exec, $volMicUp
bindel = CONTROL, XF86AudioLowerVolume, exec, $volMicDown
bindel = CONTROL, XF86AudioMute,        exec, $volMicMute
bindel = , XF86AudioMicMute,            exec, $volMicMute

# Multimedia keys for LCD brightness
bindel = , XF86MonBrightnessUp,   exec, $brightUp
bindel = , XF86MonBrightnessDown, exec, $brightDown

# Requires playerctl
bindl = ,      XF86AudioNext,  exec, $playerNext
bind  = SHIFT, XF86AudioNext,  exec, $playerForward
bindl = ,      XF86AudioPrev,  exec, $playerPrevious
bind  = SHIFT, XF86AudioPrev,  exec, $playerRewind
bindl = ,      XF86AudioPlay,  exec, $playerPlay
bindl = ,      XF86AudioPause, exec, $playerPause

# XF86Eject + NoSymbol = Eject
# XF86Tools = F13
# XF86Launch5 = BrightnessDown = F14
# XF86Launch6 = BrightnessUp = F15
# XF86Eject + Alt_L + Super_L + ISO_Next_Group = Sleep

# </multimedia>

# <submaps>

## Resize Mode
bindd = $actionMod, R, Resize Mode, submap, resize

# will start a submap called "resize"
submap = resize

# prevent any keys from passing to your active application while in a submap
# or to exit it immediately when any unknown key is pressed
# bind = , catchall, submap, reset

# sets repeatable binds for resizing the active window
binde = , left,  resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up,    resizeactive, 0 -10
binde = , down,  resizeactive, 0 10

binde = , h, resizeactive, -10 0
binde = , l, resizeactive, 10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10

binde = SHIFT, left,  splitratio, -0.1
binde = SHIFT, right, splitratio, +0.1
binde = SHIFT, h, splitratio, -0.1
binde = SHIFT, l, splitratio, +0.1

binde = , 3, resizeactive, exact 34% 50%
binde = , 5, resizeactive, exact 50% 50%
binde = , 6, resizeactive, exact 66% 50%

bind = , escape, submap, reset
submap = reset

bind = $altActionMod, 3, resizeactive, exact 34% 50%
bind = $altActionMod, 5, resizeactive, exact 50% 50%
bind = $altActionMod, 6, resizeactive, exact 66% 50%

## Service control mode
# bindd = $actionMod, D, Service Control Mode, submap, servicectl

# submap = servicectl

bindd = $hyperMod, w, Reload waybar, execr, ~/.local/bin/restart-service waybar
bindd = $hyperMod, n, Reload swaync, execr, ~/.local/bin/restart-service swaync
bindd = $hyperMod, d, Debug current window properties, execr, ~/.local/bin/hypr-dbgwin

# bind = , catchall, submap, reset
# submap = reset

## Wallper mode
bindd = $actionMod, W, Wallpaper Mode, submap, wallpaper

submap = wallpaper

binde = , left,  execr, ~/.config/hypr/scripts/hyprpaper-rotate prev
binde = , right, execr, ~/.config/hypr/scripts/hyprpaper-rotate next

bind = , catchall, submap, reset

submap = reset

# </submaps>

# <zoom>
bind = $altMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq -er '(.float * 1.1) | if . > 2 then 2 else . end')
bind = $altMod, mouse_up,   exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq -er '(.float * 0.9) | if . < 1 then 1 else . end')

bind = $altMod, 0,   exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $altMod, KP0, exec, hyprctl -q keyword cursor:zoom_factor 1
# </zoom>

