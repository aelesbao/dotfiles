# See https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Workspace names
workspace = 1, defaultName:planning
workspace = 2, defaultName:browsing
workspace = 3, defaultName:development
workspace = 4, defaultName:work
workspace = 5, defaultName:studies
workspace = 6, defaultName:gaming

# Remove gaps on fullscreen workspaces
workspace = f[1]s[false], gapsout:0, gapsin:0

# Add gaps to special workspaces
workspace = s[true], gapsout:100
workspace = special:zen, gapsout:8, gapsin:4
