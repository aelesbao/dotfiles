# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 6
  rounding_power = 4

  # Change transparency of focused and unfocused windows
  active_opacity = 0.9
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  # Dim
  dim_inactive = true
  dim_strength = 0.3
  dim_special = 0.7

  shadow {
    enabled = false
    range = 4
    render_power = 3
  }

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true

    size = 12
    passes = 3
    xray = true
    noise = 0.05
    vibrancy = 0.1696

    ignore_opacity = true
    special = false
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#group
group {
  groupbar {
    font_size = 13

    height = 22

    gradients = false
    gradient_rounding = 5

    rounding = 5
    indicator_gap = 0
    indicator_height = 2

    gaps_in = 2
    gaps_out = 2
    keep_upper_gap = false
  }
}
