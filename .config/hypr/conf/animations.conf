# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true
    workspace_wraparound = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    # Curves
    # syntax: bezier = NAME, X0, Y0, X1, Y1
    # where NAME is a name of your choice and X0, Y0, X1, Y1 are the the two control points for a Cubic Bézier curve.

    bezier = quick,          0.15, 0,   0.15, 1
    bezier = linear,         0,    0,   1,    1
    bezier = almostLinear,   0.5,  0.5, 0.75, 1
    bezier = easeOutQuint,   0.22, 1,   0.36, 1
    bezier = easeInOutCubic, 0.65, 0,   0.35, 1
    bezier = easeInOutQuart, 0.76, 0,   0.24, 1

    # Animations
    # syntax: animation = NAME, ONOFF, SPEED, CURVE [,STYLE]
    # SPEED is the amount of ds (1ds = 100ms) the animation will take.
    # CURVE is the bezier curve name, see curves.
    # STYLE (optional) is the animation style.

    # global
    animation = global, on, 5, default

    #   ↳ windows - styles: slide, popin, gnomed
    #     ↳ windowsIn - window open - styles: same as windows
    #     ↳ windowsOut - window close - styles: same as windows
    #     ↳ windowsMove - everything in between, moving, dragging, resizing.
    #
    # For animation style popin in windows, you can specify a minimum percentage to start from.
    # For example, the following will make the animation 80% -> 100% of the size:
    #
    # animation = windows, 1, 8, default, popin 80%
    #
    # For animation style slide in windows and layers you can specify a forced side.
    # You can choose between top, bottom, left or right.
    #
    # animation = windows, 1, 8, default, slide left
    animation = windows,    on, 3,   easeOutQuint, popin 80%
    animation = windowsOut, on, 1.5, easeOutQuint, popin 80%

    #   ↳ layers - styles: slide, popin, fade
    #     ↳ layersIn - layer open
    #     ↳ layersOut - layer close
    #
    # For animation style slide in windows and layers you can specify a forced side.
    # You can choose between top, bottom, left or right.
    #
    # animation = windows, 1, 8, default, slide left
    animation = layers,    on, 2.5,  easeOutQuint, fade
    animation = layersIn,  on, 2.5,  easeOutQuint, fade
    animation = layersOut, on, 1.5,  almostLinear, fade

    #   ↳ fade
    #     ↳ fadeIn - fade in for window open
    #     ↳ fadeOut - fade out for window close
    #     ↳ fadeSwitch - fade on changing activewindow and its opacity
    #     ↳ fadeShadow - fade on changing activewindow for shadows
    #     ↳ fadeDim - the easing of the dimming of inactive windows
    #     ↳ fadeLayers - for controlling fade on layers
    #       ↳ fadeLayersIn - fade in for layer open
    #       ↳ fadeLayersOut - fade out for layer close
    #     ↳ fadePopups - for controlling fade on wayland popups
    #       ↳ fadePopupsIn - fade in for wayland popup open
    #       ↳ fadePopupsOut - fade out for wayland popup close
    #     ↳ fadeDpms - for controlling fade when dpms is toggled
    animation = fade,          on, 2,    quick
    animation = fadeIn,        on, 1.73, almostLinear
    animation = fadeOut,       on, 1.46, quick
    animation = fadeLayersIn,  on, 1.79, almostLinear
    animation = fadeLayersOut, on, 1.39, quick

    #   ↳ border - for animating the border's color switch speed
    animation = border,      on, 5.39, easeOutQuint
    #   ↳ borderangle - for animating the border's gradient angle - styles: once (default), loop
    animation = borderangle, off

    #   ↳ workspaces - styles: slide, slidevert, fade, slidefade, slidefadevert
    #     ↳ workspacesIn - styles: same as workspaces
    #     ↳ workspacesOut - styles: same as workspaces
    #     ↳ specialWorkspace - styles: same as workspaces
    #       ↳ specialWorkspaceIn - styles: same as workspaces
    #       ↳ specialWorkspaceOut - styles: same as workspaces
    #
    # For animation styles slide, slidevert, slidefade and slidefadevert in workspaces, you can specify
    # a movement percentage. For example, the following will make windows move 20% of the screen width:
    #
    # animation = workspaces, 1, 8, default, slidefade 20%
    animation = workspaces,       on, 1.2, almostLinear, slide
    animation = workspacesIn,     on, 1.2, linear,       slide
    animation = workspacesOut,    on, 1.5, linear,       slide
    animation = specialWorkspace, on, 1.2, quick,        fade

    #   ↳ zoomFactor - animates the screen zoom
    animation = zoomFactor, on, 2, easeInOutCubic

    #   ↳ monitorAdded - monitor added zoom animation
    animation = monitorAdded, on, 5, easeInOutQuart
}
