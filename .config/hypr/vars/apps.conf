# Refer to https://wiki.hyprland.org/Configuring/Variables/

# Set programs that you use
$menu = rofi -show combi -theme launcher
# $menu = onagre --scale 1.2
$calc = rofi -show calc -theme calc -calc-command "echo -n '{result}' | wl-copy" -automatic-save-to-history
$emoji = rofi -show combi -theme icons -emoji-mode copy
# uses proposed xdg-terminal-exec
$terminal = uwsm app -T
$fileManager = uwsm app -- nautilus
$screenshot = uwsm app -- hyprshot -m region -o ~/Pictures/Screenshots
# $notificationHistory = dunstctl history-pop
$notificationHistory = swaync-client --toggle-panel --skip-wait
$dismissNotifications = swaync-client --hide-all
$toggleDND = swaync-client --toggle-dnd
$clipboardHistory = uwsm app -- kitty --class=clipse --instance-group=clipse --single-instance clipse
# $clipboardHistory = cliphist list | rofi -dmenu | cliphist decode | wl-copy
$passwordManager = 1password --quick-access
$colorPicker = uwsm app -- hyprpicker --autocopy --lowercase-hex

# Volume control commands
# $volUp      = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# $volDown    = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# $volMute    = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# $volMicMute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Alternative volume control commands with notifications
# $volUp   = set-volume up 5
# $volDown = set-volume down 5
# $volMute = set-volume mute

# playerctl commands
$playerNext     = playerctl next
$playerForward  = playerctl position +5
$playerPrevious = playerctl previous
$playerRewind   = playerctl position -5
$playerPlay     = playerctl play-pause
$playerPause    = playerctl play-pause

# Brightness control commands
# $brightUp = brightnessctl s 10%+
# $brightDown = brightnessctl s 10%-

# SwayOSD
$volUp      = swayosd-client --output-volume raise --max-volume 100
$volDown    = swayosd-client --output-volume lower --max-volume 100
$volMute    = swayosd-client --output-volume mute-toggle

$volMicUp   = swayosd-client --input-volume raise --max-volume 100
$volMicDown = swayosd-client --input-volume lower --max-volume 100
$volMicMute = swayosd-client --input-volume mute-toggle

$playerNext     = swayosd-client --playerctl next
$playerPrevious = swayosd-client --playerctl previous
$playerPlay     = swayosd-client --playerctl play-pause
$playerPause    = swayosd-client --playerctl play-pause

$brightUp   = swayosd-client --brightness raise
$brightDown = swayosd-client --brightness lower
