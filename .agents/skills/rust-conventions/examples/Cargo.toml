[package]
name = "rust-conventions-examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Checked teaching examples for the rust-conventions skill"

[dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.17"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
tokio = { version = "=1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["attributes", "std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
